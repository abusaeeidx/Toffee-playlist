name: upott

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download M3U
        run: |
          curl -L --fail "${{ secrets.PRIMARY_URL }}" -o ott_navigator.m3u

      - name: Download JSON
        run: |
          curl -L --fail "${{ secrets.JSON_URL }}" -o NS_player.json

      - name: Add playbacks_url fields
        run: |
          jq '
            map(
              . as $o
              | ($o.name
                  | ascii_downcase
                  | gsub("[^a-z0-9]+";"_")
                  | gsub("^_|_$";"")
                ) as $key
              | .single_playbacks_url = (.link + "|cookie=" + .cookie)
              | . + {
                  ($key + "_playbacks_url"): (.link + "|cookie=" + .cookie)
                }
            )
          ' NS_player.json > tmp.json

          mv tmp.json NS_player.json

      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add ott_navigator.m3u NS_player.json

          git commit -m "Auto update files" || exit 0
          git push
