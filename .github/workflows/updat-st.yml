name: upott

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download M3U
        run: |
          curl -L --fail "${{ secrets.PRIMARY_URL }}" -o source.m3u

      - name: Build Final M3U
        run: |
          echo "#EXTM3U" > ott_navigator.m3u

          # Add custom channel (Base64 encoded)
          echo "${{ secrets.CUSTOM_CHANNEL_B64 }}" | base64 -d >> ott_navigator.m3u
          echo "" >> ott_navigator.m3u

          # Append downloaded playlist (skip duplicate header)
          grep -v "^#EXTM3U" source.m3u >> ott_navigator.m3u

      - name: Download JSON
        run: |
          curl -L --fail "${{ secrets.JSON_URL }}" -o NS_player.json

      - name: Update JSON & Generate Temp Files
        run: |
          # Update NS_player.json
          jq '
            map(
              . as $item
              | ($item.name
                  | ascii_downcase
                  | gsub("[^a-z0-9]+";"_")
                  | gsub("^_|_$";"")
                ) as $key
              | .single_playbacks_url = (.link + "|cookie=" + .cookie)
              | . + {
                  ($key + "_playbacks_url"): (.link + "|cookie=" + .cookie)
                }
            )
          ' NS_player.json > tmp.json

          mv tmp.json NS_player.json

          # Create temp folder
          rm -rf temp
          mkdir -p temp

          # Create temp/{id}.json
          jq -c '.[]' NS_player.json | while read -r item; do
            id=$(echo "$item" | jq -r '.id')

            key=$(echo "$item" | jq -r '.name' \
              | tr '[:upper:]' '[:lower:]' \
              | sed -E 's/[^a-z0-9]+/_/g;s/^_+|_+$//g')

            value=$(echo "$item" | jq -r '.link + "|cookie=" + .cookie')

            jq -n \
              --arg key "${key}_playbacks_url" \
              --arg value "$value" \
              '{
                playbacks_url: $value
              } + {
                ($key): $value
              }' > "temp/${id}.json"
          done

      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add ott_navigator.m3u NS_player.json temp/

          git commit -m "Auto update playlist & JSON" || exit 0

          git push
