name: upott

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download M3U
        run: |
          curl -L --fail "${{ secrets.PRIMARY_URL }}" -o source.m3u

      - name: Build Final M3U
        run: |
          echo "#EXTM3U" > ott_navigator.m3u

          # Add custom channel
          echo "${{ secrets.CUSTOM_CHANNEL_B64 }}" | base64 -d >> ott_navigator.m3u
          echo "" >> ott_navigator.m3u

          # Append downloaded playlist (skip duplicate header)
          grep -v "^#EXTM3U" source.m3u >> ott_navigator.m3u

      - name: Download JSON
        run: |
          curl -L --fail "${{ secrets.JSON_URL }}" -o NS_player.json

      - name: Add playbacks_url fields
        run: |
          jq '
            map(
              . as $item
              | ($item.name
                  | ascii_downcase
                  | gsub("[^a-z0-9]+";"_")
                  | gsub("^_|_$";"")
                ) as $key
              | .single_playbacks_url = (.link + "|cookie=" + .cookie)
              | . + {
                  ($key + "_playbacks_url"): (.link + "|cookie=" + .cookie)
                }
            )
          ' NS_player.json > tmp.json

          mv tmp.json NS_player.json

      - name: Create temp.cache
        run: |
          # Same JSON without [ ]
          sed '1s/^\[//;$s/\]$//' NS_player.json > temp.cache

      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add \
            ott_navigator.m3u \
            NS_player.json \
            temp.cache

          git commit -m "Auto update playlist & JSON" || exit 0
          git push
